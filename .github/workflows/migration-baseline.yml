name: Migration baseline guardrails
on:
  push:
    branches:
      - 'migration/**'
  pull_request:
    branches:
      - migration/trunk
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:baseline
