name: Publish Phase 4 testing build to gh-pages
on:
  push:
    branches: [feature/phase4-ux-data-refinement]
    paths:
      - '.github/workflows/publish-audit-to-gh-pages.yml'
      - 'src/**'
      - 'js/**'
      - 'css/**'
      - 'data/**'
      - 'docs/**'
      - 'index.html'
      - 'vue-preview.html'
      - 'vite.config.ts'
      - 'package*.json'
      - 'tsconfig*.json'
      - 'tests/**'
      - 'scripts/**'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: oas-phase4-gh-pages-publish
  cancel-in-progress: false
jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - name: Build for repository Pages path
        env:
          OAS_PUBLIC_BASE: /OASTrailmap/
        run: npm run build
      - run: npm run check:dist
      - run: node scripts/check-static-subpath.cjs
      - name: Mark static site and publish compiled dist only
        shell: bash
        run: |
          set -euo pipefail
          touch dist/.nojekyll
          printf '%s\n' "Build source: ${GITHUB_SHA}" "Channel: Phase 4 testing candidate (PR #40); not approved for production." "This branch contains compiled static output only." > dist/BUILD-INFO.txt
          cd dist
          git init -b gh-pages
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m "Publish audited Vue dist from ${GITHUB_SHA}"
          git remote add publish "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push --force publish HEAD:refs/heads/gh-pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
