name: Legacy browser baseline (migration only)
on:
  push:
    branches:
      - migration/phase-01-baseline
  pull_request:
    branches:
      - migration/trunk
permissions:
  contents: read
jobs:
  legacy-browser:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Temporary Phase 1 tool; replace with locked dev dependencies in Phase 2.
      - run: npm install --no-save --no-package-lock playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - name: Inspect unchanged legacy app in headless Chromium
        run: |
          python3 -m http.server 8765 --bind 127.0.0.1 >/tmp/oas-server.log 2>&1 &
          sleep 2
          node tests/e2e/legacy-browser-smoke.cjs
      - name: Archive fictional-data screenshots for parity review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-ui-baseline
          path: tests/baseline-artifacts/
          if-no-files-found: ignore
