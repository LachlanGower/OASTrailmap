name: Phase 4C.3 Vue Scout progress parity (no deployment)
on:
  push:
    branches:
      - migration/phase-04c3-vue-scout-progress
  pull_request:
    branches:
      - migration/trunk
permissions:
  contents: read
jobs:
  scout-progress:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - name: Baseline contracts and all pure domain tests
        run: npm test
      - name: Build Vue workspaces; retain original static files
        run: |
          npm run build
          npm run check:dist
      - run: npx playwright install --with-deps chromium
      - name: Compare Vue and legacy Scout selection, dates, group saves and backups
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 >/tmp/oas-scout-dev.log 2>&1 &
          python3 -m http.server 8765 --bind 127.0.0.1 -d dist >/tmp/oas-scout-build.log 2>&1 &
          sleep 3
          OAS_TEST_URL=http://127.0.0.1:5173/ node tests/e2e/scout-progress-parity.cjs
          OAS_TEST_URL=http://127.0.0.1:8765/ node tests/e2e/scout-progress-parity.cjs
      - name: Fictional-data review screenshots
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: phase-04c3-scout-parity
          path: tests/baseline-artifacts/phase4c3/
          if-no-files-found: ignore
