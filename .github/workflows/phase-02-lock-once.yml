name: Temporary Phase 2 dependency lock
on:
  push:
    branches:
      - migration/phase-02-foundation
jobs:
  lock:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Generate and commit lockfile once
        run: |
          if [ -f package-lock.json ]; then
            echo "Existing package-lock.json detected; no changes."
            exit 0
          fi
          npm install --package-lock-only --ignore-scripts
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add package-lock.json
          git commit -m 'chore(phase2): commit npm lockfile'
          git push origin HEAD:refs/heads/migration/phase-02-foundation
